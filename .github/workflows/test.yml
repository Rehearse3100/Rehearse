# Runs the Vitest suite on every push and pull request.
# No secrets. No live database. Placeholder env vars satisfy Next.js build only.

name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Obviously fake placeholders — required for `next build` only. Not real keys.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      STUDENT_SESSION_SECRET: test-student-session-secret-not-real
      OPENAI_API_KEY: test-openai-key-not-real
      ANAM_API_KEY: test-anam-key-not-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
